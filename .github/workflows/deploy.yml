name: Deploy to Biznet Gio cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbzf0JlgPmUfO8T8xgul8CEivPFm8g8wdxlAM-SgigcxB--htcFN63wnafJTsLqSUa1F/exec

      - name: Prepare Tar Package
        run: |
          cd out
          tar -cf ../deploy.tar .
          cd ..
          echo "Tar package created: deploy.tar ($(du -h deploy.tar | cut -f1))"

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload and Extract on cPanel (Fast & 100% Reliable)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Uploading deploy.tar and deploy.php via FTPS..."
          lftp <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ftp:passive-mode yes
          set ftp:prefer-epsv no
          set net:timeout 30
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          put -f deploy.tar -o deploy.tar
          put -f deploy.php -o deploy.php
          cd public_html || cd ./
          put -f deploy.tar -o deploy.tar
          put -f deploy.php -o deploy.php
          quit
          EOF
          echo "Upload finished. Triggering instant server extraction..."
          
          # Trigger extraction via domain
          HTTP_RES=$(curl -k -s -L "https://nattuglobalsynergy.co.id/deploy.php?token=nsg_deploy_secret_2026" || true)
          echo "Server Response: $HTTP_RES"
          
          if [[ "$HTTP_RES" == *"DEPLOY_SUCCESS"* ]]; then
            echo "Deployment fully completed!"
          else
            echo "Retrying via www..."
            HTTP_RES_WWW=$(curl -k -s -L "https://www.nattuglobalsynergy.co.id/deploy.php?token=nsg_deploy_secret_2026" || true)
            echo "Server Response WWW: $HTTP_RES_WWW"
          fi
