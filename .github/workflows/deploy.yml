name: Build & Deploy to cPanel (Biznet Gio)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Next.js Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbzf0JlgPmUfO8T8xgul8CEivPFm8g8wdxlAM-SgigcxB--htcFN63wnafJTsLqSUa1F/exec

      - name: Prepare Deploy Package
        run: |
          cp deploy-receiver.php out/deploy-receiver.php
          tar -czf site.tar.gz -C out .
          echo "📦 Package: site.tar.gz ($(du -h site.tar.gz | cut -f1))"

      - name: Deploy via FTP (lftp) + HTTP Trigger
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          echo "📦 Step 1/3: Installing lftp..."
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null 2>&1
          echo "✅ lftp installed"

          echo "📤 Step 2/3: Uploading files via FTP..."
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "set ssl:verify-certificate false; set ftp:ssl-allow false; set net:timeout 30; set net:max-retries 3; set net:reconnect-interval-base 5; set cmd:fail-exit false; pwd; put site.tar.gz; put unpacker-gz.php; ls -la site.tar.gz; ls -la unpacker-gz.php; bye"
          echo "✅ FTP upload completed!"

          echo "🔧 Step 3/3: Triggering remote extraction..."
          sleep 2
          RESPONSE=$(curl -sk --max-time 120 --resolve "nattuglobalsynergy.co.id:443:103.125.180.51" "https://nattuglobalsynergy.co.id/unpacker-gz.php?token=nsg_deploy_secret_2026" || true)
          echo "📥 Unpacker response:"
          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q "DEPLOY_SUCCESS"; then
            echo "🎉 Deployment completed successfully!"
          else
            echo "⚠️ Unpacker may not have fully succeeded. Trying Node.js fallback..."
            node scripts/deploy-ftp.js || true
          fi

      - name: Verify Deployment
        if: always()
        run: |
          echo "⏳ Waiting 5s for server to settle..."
          sleep 5
          echo "🔍 Verifying deployment..."

          HTTP_HOME=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 15 --resolve "nattuglobalsynergy.co.id:443:103.125.180.51" "https://nattuglobalsynergy.co.id/")
          HTTP_SUPPORT=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 15 --resolve "nattuglobalsynergy.co.id:443:103.125.180.51" "https://nattuglobalsynergy.co.id/support/")

          echo "📊 Results:"
          echo "  Homepage:       HTTP $HTTP_HOME"
          echo "  Support Portal: HTTP $HTTP_SUPPORT"

          if [ "$HTTP_HOME" = "200" ] && [ "$HTTP_SUPPORT" = "200" ]; then
            echo "🎉 ✅ Deployment verified successfully!"
          else
            echo "⚠️ Some pages returned non-200. Check https://nattuglobalsynergy.co.id manually."
            exit 1
          fi
