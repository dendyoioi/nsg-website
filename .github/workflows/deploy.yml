name: Build & Deploy to cPanel (Biznet Gio)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Next.js Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbyiywcByOzbNMsgapT2wmGYlD_W9w5GVWFjAV0h9c9GnY2cF0XQwzuju2mnTLvLqRMp/exec

      - name: Prepare Deploy Package
        run: |
          cp deploy-receiver.php out/deploy-receiver.php
          cp deploy-check.html out/deploy-check.html 2>/dev/null || true
          tar -czf site.tar.gz -C out .
          echo "📦 Package: site.tar.gz ($(du -h site.tar.gz | cut -f1))"

      - name: Deploy via FTP + Remote Unpacker
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: bash scripts/deploy.sh

      - name: Verify Deployment
        if: always()
        run: |
          echo "⏳ Waiting 5s for server to settle..."
          sleep 5
          echo "🔍 Verifying live site deployment..."

          HTTP_HOME=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 15 --resolve "nattuglobalsynergy.co.id:443:103.125.180.51" "https://nattuglobalsynergy.co.id/")
          HTTP_SUPPORT=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 15 --resolve "nattuglobalsynergy.co.id:443:103.125.180.51" "https://nattuglobalsynergy.co.id/support/")

          echo "📊 Results:"
          echo "  Homepage:       HTTP $HTTP_HOME"
          echo "  Support Portal: HTTP $HTTP_SUPPORT"

          if [ "$HTTP_HOME" = "200" ] && [ "$HTTP_SUPPORT" = "200" ]; then
            echo "🎉 ✅ Deployment verified successfully!"
          else
            echo "⚠️ Some pages returned non-200. Check https://nattuglobalsynergy.co.id manually."
            exit 1
          fi
