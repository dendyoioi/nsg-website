name: Deploy to Biznet Gio cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbzf0JlgPmUfO8T8xgul8CEivPFm8g8wdxlAM-SgigcxB--htcFN63wnafJTsLqSUa1F/exec

      - name: Prepare Package
        run: |
          cd out
          tar -cf ../site.tar .
          cd ..
          echo "Package prepared: site.tar ($(du -h site.tar | cut -f1))"

      - name: Deploy via Secure HTTPS Webhook
        id: http_deploy
        continue-on-error: true
        run: |
          echo "Attempting high-speed HTTPS deployment..."
          RESPONSE=$(curl -k -s -L -m 20 -X POST \
            -F "package=@site.tar" \
            -F "token=nsg_secret_deploy_key_998124018247" \
            "https://nattuglobalsynergy.co.id/deploy-receiver.php" || true)
          echo "HTTP Deployment Response: $RESPONSE"
          
          if [[ "$RESPONSE" == *"\"status\":\"success\""* ]]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "Deployment completed instantly via HTTPS!"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "Receiver not ready yet, falling back to FTPS upload..."
          fi

      - name: Fallback FTPS Upload and Server Extraction
        if: steps.http_deploy.outputs.success != 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          echo "Uploading package and receiver to cPanel with 15s timeout..."
          lftp -e "set ssl:verify-certificate no; set ftp:ssl-allow yes; set ftp:ssl-force no; set ftp:passive-mode yes; set ftp:prefer-epsv no; set net:timeout 15; set net:max-retries 1; put site.tar; put deploy-receiver.php; put unpacker.php; quit" -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" || true
          
          echo "Triggering extraction..."
          curl -k -s -L -m 15 "https://nattuglobalsynergy.co.id/unpacker.php?token=nsg_deploy_secret_2026" || true
          
          echo "Deployment routine finished!"
