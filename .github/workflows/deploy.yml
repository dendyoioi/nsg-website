name: Deploy to Biznet Gio cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbzf0JlgPmUfO8T8xgul8CEivPFm8g8wdxlAM-SgigcxB--htcFN63wnafJTsLqSUa1F/exec

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Sync out folder to cPanel via lftp (Fast & Reliable)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Connecting and syncing files to cPanel..."
          lftp <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set ftp:passive-mode yes
          set net:timeout 30
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          mirror -R --verbose=1 ./out/ ./
          quit
          EOF
          echo "Deploy completed successfully!"
