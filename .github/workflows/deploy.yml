name: Build & Deploy to cPanel (Biznet Gio)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Next.js Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbzf0JlgPmUfO8T8xgul8CEivPFm8g8wdxlAM-SgigcxB--htcFN63wnafJTsLqSUa1F/exec

      - name: Prepare Deploy Package
        run: |
          cp deploy-receiver.php out/deploy-receiver.php
          cp deploy-check.html out/deploy-check.html 2>/dev/null || true
          tar -czf site.tar.gz -C out .
          echo "📦 Package: site.tar.gz ($(du -h site.tar.gz | cut -f1))"

      - name: Deploy via FTP + HTTP Trigger
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          npm install basic-ftp
          node scripts/deploy-ftp.js

      - name: Verify Deployment
        if: success()
        run: |
          echo "⏳ Waiting 5s for server to settle..."
          sleep 5
          echo "🔍 Verifying deployment..."

          # Check homepage
          HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 15 \
            --resolve "nattuglobalsynergy.co.id:443:103.125.180.51" \
            "https://nattuglobalsynergy.co.id/")
          echo "Homepage: HTTP $HTTP_CODE"

          # Check support portal
          HTTP_CODE2=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 15 \
            --resolve "nattuglobalsynergy.co.id:443:103.125.180.51" \
            "https://nattuglobalsynergy.co.id/support/")
          echo "Support Portal: HTTP $HTTP_CODE2"

          # Check deploy-check.html
          HTTP_CODE3=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 15 \
            --resolve "nattuglobalsynergy.co.id:443:103.125.180.51" \
            "https://nattuglobalsynergy.co.id/deploy-check.html")
          echo "Deploy Validator: HTTP $HTTP_CODE3"

          if [ "$HTTP_CODE" = "200" ] && [ "$HTTP_CODE2" = "200" ]; then
            echo "🎉 Deployment verified successfully!"
          else
            echo "⚠️ Some pages returned non-200. Please check manually."
          fi
