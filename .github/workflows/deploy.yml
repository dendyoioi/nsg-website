name: Automated Deployment to Biznet Gio cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbzf0JlgPmUfO8T8xgul8CEivPFm8g8wdxlAM-SgigcxB--htcFN63wnafJTsLqSUa1F/exec

      - name: Prepare Optimized Package
        run: |
          cp deploy-receiver.php out/deploy-receiver.php
          tar -czf site.tar.gz -C out .
          echo "Package prepared: site.tar.gz ($(du -h site.tar.gz | cut -f1))"

      - name: Deploy via High-Speed HTTPS Receiver
        run: node scripts/deploy-https.js
