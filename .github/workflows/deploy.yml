name: Deploy to Biznet Gio cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbzf0JlgPmUfO8T8xgul8CEivPFm8g8wdxlAM-SgigcxB--htcFN63wnafJTsLqSUa1F/exec

      - name: Prepare Single ZIP Package
        run: |
          cd out
          zip -q -r ../deploy.zip .
          cd ..
          echo "Package created: deploy.zip ($(du -h deploy.zip | cut -f1))"

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload and Extract on cPanel (Lightning Fast)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Uploading deploy.zip and extract.php to cPanel..."
          lftp <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow no
          set ftp:passive-mode yes
          set ftp:prefer-epsv no
          set net:timeout 30
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          put -O ./ deploy.zip
          put -O ./ extract.php
          quit
          EOF
          echo "Files uploaded. Triggering instant server-side unzip..."
          
          # Trigger extraction via domain or server hostname
          HTTP_RES=$(curl -k -s -L "https://www.nattuglobalsynergy.co.id/extract.php?token=nsg_deploy_secret_2026" || true)
          echo "Server Response: $HTTP_RES"
          
          if [[ "$HTTP_RES" == *"DEPLOY_SUCCESS"* ]]; then
            echo "Deployment finished successfully in seconds!"
          else
            echo "Triggering fallback HTTP request via HTTP..."
            curl -k -s -L "http://www.nattuglobalsynergy.co.id/extract.php?token=nsg_deploy_secret_2026" || true
            echo "Deploy finished!"
          fi
