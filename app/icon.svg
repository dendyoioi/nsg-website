<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f1c"/>
      <stop offset="50%" stop-color="#0a3c37"/>
      <stop offset="100%" stop-color="#0f5c54"/>
    </linearGradient>
    <linearGradient id="g-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Smooth Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="#14b8a6" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- NGS Text Emblem -->
  <g filter="url(#glow)">
    <text x="32" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="21" letter-spacing="-0.5">
      <tspan fill="#ffffff">N</tspan><tspan fill="url(#g-text)">G</tspan><tspan fill="#ffffff">S</tspan>
    </text>
  </g>
</svg>
